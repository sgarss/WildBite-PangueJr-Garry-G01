{% extends 'base.html' %}

{% block title %}Delete {{ kind }}{% endblock %}

{% block content %}
<section class="card card-center">
  <h1>Delete {{ kind }}?</h1>
  <p>Are you sure you want to delete <strong>{{ object }}</strong>? This can't be undone.</p>

  <form method="post" class="form-actions form-actions-center">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a class="btn btn-outline" href="{{ cancel_url }}">Cancel</a>
  </form>
</section>
{% endblock %}
