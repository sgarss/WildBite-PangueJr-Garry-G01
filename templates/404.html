{% extends 'base.html' %}

{% block title %}Page not found{% endblock %}

{% block content %}
<section class="card card-center">
  <h1>Page not found</h1>
  <p class="muted">The page you're looking for doesn't exist, was removed, or isn't yours to view.</p>
  {% if user.is_authenticated %}
    <a class="btn btn-primary" href="{% url 'accounts:dashboard' %}">Go to my dashboard</a>
  {% else %}
    <a class="btn btn-primary" href="{% url 'home' %}">Back to home</a>
  {% endif %}
</section>
{% endblock %}
